version = 3

# ───────────────────────────────────────────────────────────────────────────────
# TOKYONIGHT-NIGHT PALETTE
# ───────────────────────────────────────────────────────────────────────────────
[palette]
main_bg          = "#1a1b26"  # terminal background
panel_bg         = "#24283b"
panel_bg_alt     = "#1f2335"

fg               = "#c0caf5"  # primary light text
muted            = "#9aa5ce"  # secondary text
muted_darker     = "#565f89"

accent_pink      = "#f7768e"
accent_blue      = "#7aa2f7"
accent_cyan      = "#7dcfff"
accent_green     = "#9ece6a"
accent_yellow    = "#e0af68"
accent_magenta   = "#bb9af7"

# calmer path background tones
path_bg          = "#3b4261"
path_bg2         = "#394b70"

# git state backgrounds
git_clean_bg     = "#9ece6a"
git_dirty_bg     = "#e0af68"
git_diverged_bg  = "#bb9af7"
git_ahead_behind = "#7dcfff"

# transient prompt colors
t_background     = "p:panel_bg"

# ───────────────────────────────────────────────────────────────────────────────
# TRANSIENT PROMPT (single-line prompt after command)
# ───────────────────────────────────────────────────────────────────────────────
[transient_prompt]
background = "t_background"
foreground = "p:accent_blue"
template   = " ❯ "

# ───────────────────────────────────────────────────────────────────────────────
# LEFT PROMPT (row 1)
# ───────────────────────────────────────────────────────────────────────────────
[[blocks]]
type      = "prompt"
alignment = "left"
newline   = true

  # OS pill
  [[blocks.segments]]
  type             = "os"
  style            = "diamond"
  leading_diamond  = "╭─"
  template         = " {{ .Icon }} "
  foreground       = "p:main_bg"
  background       = "p:accent_pink"
  [blocks.segments.properties]
  alpine   = ""
  arch     = ""
  centos   = ""
  debian   = ""
  elementary = ""
  fedora   = ""
  gentoo   = ""
  linux    = ""
  macos    = ""
  manjaro  = ""
  mint     = ""
  opensuse = ""
  raspbian = ""
  ubuntu   = ""
  windows  = ""

  # user pill
  [[blocks.segments]]
  type             = "session"
  style            = "powerline"
  template         = " {{ .UserName }} "
  foreground       = "p:muted"
  background       = "p:panel_bg"
  powerline_symbol = ""
  min_width        = 55

  # path (calmer blue)
  [[blocks.segments]]
  type             = "path"
  style            = "powerline"
  template         = " {{ .Path }} "
  foreground       = "p:fg"
  background       = "p:path_bg"
  powerline_symbol = ""
  min_width        = 41
  [blocks.segments.properties]
  folder_icon           = "…"
  folder_separator_icon = " <transparent></> "
  max_depth             = 3
  style                 = "agnoster_short"

  [[blocks.segments]]
  type             = "path"
  style            = "powerline"
  template         = " {{ .Folder }} "
  foreground       = "p:fg"
  background       = "p:path_bg"
  powerline_symbol = ""
  max_width        = 40
  [blocks.segments.properties]
  folder_icon           = "…"
  folder_separator_icon = " <transparent></> "
  max_depth             = 3
  style                 = "agnoster_short"

  # git (adaptive backgrounds)
  [[blocks.segments]]
  type              = "git"
  style             = "diamond"
  leading_diamond   = "<transparent,background></>"
  trailing_diamond  = ""
  template = " {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} <transparent></> <p:main_bg> {{ .Working.String }}</>{{ end }}{{ if .Staging.Changed }} <transparent></> <p:main_bg> {{ .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }} <transparent></> <p:main_bg> {{ .StashCount }}</>{{ end }} "
  foreground        = "p:main_bg"      # dark text on bright git bg
  background        = "p:git_clean_bg" # default when clean
  [blocks.segments.properties]
  fetch_status        = true
  fetch_stash_count   = true
  branch_icon         = " "
  branch_identical_icon = ""
  branch_gone_icon    = ""
  branch_max_length   = 25
  # adapt background by state (order matters)
  background_templates = [
    '{{ if or (.Working.Changed) (.Staging.Changed) }}p:git_dirty_bg{{ end }}',
    '{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:git_diverged_bg{{ end }}',
    '{{ if or (gt .Ahead 0) (gt .Behind 0) }}p:git_ahead_behind{{ end }}'
  ]

# ───────────────────────────────────────────────────────────────────────────────
# RIGHT PROMPT (row 1)
# ───────────────────────────────────────────────────────────────────────────────
[[blocks]]
type      = "prompt"
alignment = "right"

  # execution time
  [[blocks.segments]]
  type             = "executiontime"
  style            = "powerline"
  template         = "  {{ .FormattedMs }} "
  foreground       = "p:muted_darker"
  background       = "p:panel_bg"
  powerline_symbol = ""
  invert_powerline = true
  min_width        = 85                 # <- here
  [blocks.segments.properties]
  always_enabled = true
  style          = "austin"

  # clock diamond
  [[blocks.segments]]
  type             = "time"
  style            = "diamond"
  trailing_diamond = ""
  template         = "  {{ .CurrentDate | date .Format }} "
  foreground       = "p:main_bg"
  background       = "p:accent_blue"
  invert_powerline = true
  min_width        = 85                 # <- and here
  [blocks.segments.properties]
  time_format = "15:04:05"

# ───────────────────────────────────────────────────────────────────────────────
# LEFT PROMPT (row 2) — prompt symbol
# ───────────────────────────────────────────────────────────────────────────────
[[blocks]]
type      = "prompt"
alignment = "left"
newline   = true

  [[blocks.segments]]
  type       = "text"
  style      = "plain"
  template   = "╰─ {{ if .Root }}#{{ else }}${{ end }}"
  foreground = "p:accent_pink"
